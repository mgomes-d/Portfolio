services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
       - portfolio_net
    restart: unless-stopped

networks:
  portfolio_net:
    driver: bridge
    name: portfolio_net